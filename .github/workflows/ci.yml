name: CI — Validador DNI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar los tests
        run: mvn test -B

      - name: Guardar el informe de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests
          path: target/surefire-reports/

  empaquetar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Empaquetar el JAR
        run: mvn package -DskipTests -B

      - name: Guardar el JAR como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: validador-dni-jar
          path: target/validador-dni.jar

generar_manifiesto:
  runs-on: ubuntu-latest
  needs: empaquetar
  steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v7

    - name: Generar build-info
      env:
        DEPLOY_ID: ${{ secrets.DEPLOY_ID }}
      run: |
        echo "Proyecto: validador-dni-ci" > build-info.txt
        echo "Commit: $GITHUB_SHA" >> build-info.txt
        echo "Fecha UTC: $(date -u)" >> build-info.txt
        echo "Deploy ID (hash): $(echo -n "$DEPLOY_ID" | sha256sum | cut -c1-12)" >> build-info.txt

    - name: Guardar manifiesto
      uses: actions/upload-artifact@v7
      with:
        name: build-info
        path: build-info.txt